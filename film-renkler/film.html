<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=block">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let TL = null, ID = {};
const FONT = '"Baloo 2", "DejaVu Sans", sans-serif';
const POS = {};
let NOW = 0;

// ================= helpers =================
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => Math.pow(clamp(t), 3);
const easeBack = t => { t = clamp(t); const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const I = id => ID[id];
const since = id => NOW - ID[id];
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx) + .01, Math.abs(ry) + .01, rot, 0, Math.PI * 2); }
function circ(x, y, r) { ell(x, y, r, r); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function withSat(s, fn) { ctx.save(); if (s < .995) ctx.filter = `saturate(${Math.max(0, s)})`; fn(); ctx.restore(); }

function lineAt(t, pad = 0) { return TL.lines.find(l => t >= l.start && t < l.start + l.dur + pad); }
function mouth(who, t) { const l = lineAt(t); if (!l || l.who !== who || l.inner) return 0; const k = Math.floor((t - l.start) * TL.fps); return l.env[k] || 0; }
function talking(who, t) { const l = lineAt(t); return !!l && l.who === who && !l.inner; }
function thinking(who, t) { const l = lineAt(t, .2); return !!l && l.who === who && l.inner; }
function blink(t, seed) { const p = (t + seed * 1.7) % 3.4; return p < 0.12 ? 1 - Math.abs(p - 0.06) / 0.06 : 0; }
function reg(who, x, y, s) { const m = ctx.getTransform(); const p = m.transformPoint(new DOMPoint(x, y)); POS[who] = { x: p.x, y: p.y, s: s * Math.hypot(m.a, m.b) }; }
function lookAt(who) {
  const l = lineAt(NOW, .3); if (!l || l.who === who || !POS[l.who] || !POS[who]) return [0, 0];
  const dx = POS[l.who].x - POS[who].x, dy = POS[l.who].y - POS[who].y, d = Math.hypot(dx, dy) || 1; return [dx / d, dy / d * .7];
}
const talkBob = (who, t) => talking(who, t) ? -Math.abs(Math.sin(t * 7)) * 8 : 0;

// ================= drawing primitives =================
function starPath(x, y, R, r, rot = 0, n = 5) {
  ctx.beginPath();
  for (let i = 0; i <= n * 2; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / n, rad = i % 2 ? r : R;
    const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py); else {
      const pa = rot - Math.PI / 2 + (i - .5) * Math.PI / n, pr = (i % 2 ? R : r) * .98;
      ctx.quadraticCurveTo(x + Math.cos(pa) * (rad + pr) / 2.05, y + Math.sin(pa) * (rad + pr) / 2.05, px, py);
    }
  }
  ctx.closePath();
}
function sparkle(x, y, s, a = 1, col = '255,245,180') {
  if (a <= 0 || s <= 0) return;
  ctx.fillStyle = `rgba(${col},${a})`;
  ctx.beginPath(); ctx.moveTo(x, y - s); ctx.quadraticCurveTo(x, y, x + s, y); ctx.quadraticCurveTo(x, y, x, y + s); ctx.quadraticCurveTo(x, y, x - s, y); ctx.quadraticCurveTo(x, y, x, y - s); ctx.fill();
}
function glow(x, y, r, col, a) {
  if (a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; circ(x, y, r); ctx.fill();
}
function eyes(x, y, dx, rx, ry, bl, look = [0, 0], big = 1, closed = false) {
  for (const sx of [-1, 1]) {
    const ex = x + sx * dx;
    if (closed) { ctx.strokeStyle = '#1b1530'; ctx.lineWidth = rx * .35; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(ex, y, rx * .9, Math.PI * .15, Math.PI * .85); ctx.stroke(); continue; }
    ctx.save(); ctx.translate(ex + look[0] * rx * .35, y + look[1] * ry * .3); ctx.scale(1, Math.max(.08, 1 - bl));
    ctx.fillStyle = '#1b1530'; ell(0, 0, rx * big, ry * big); ctx.fill();
    if (bl < .5) {
      ctx.fillStyle = '#fff'; circ(-rx * .3, -ry * .35, rx * .42 * big); ctx.fill();
      circ(rx * .3, ry * .3, rx * .18 * big); ctx.fill();
    }
    ctx.restore();
  }
}
function mouthShape(x, y, w, open, smile = 1, col = '#7a1f3d') {
  if (open > .06) {
    const h = w * .25 + open * w * .7;
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x - w / 2, y);
    ctx.quadraticCurveTo(x, y - h * .25 * smile, x + w / 2, y); ctx.quadraticCurveTo(x, y + h * 1.3, x - w / 2, y); ctx.fill();
    ctx.fillStyle = '#ff7f96'; ell(x, y + h * .5, w * .22, h * .22); ctx.fill();
  } else {
    ctx.strokeStyle = col; ctx.lineWidth = w * .14; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.quadraticCurveTo(x, y + w * .45 * smile, x + w / 2, y); ctx.stroke();
  }
}
function brows(x, y, dx, w, ang, col = '#1b1530', lw = 6) {
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + sx * (dx - w / 2), y - ang * w * .5); ctx.lineTo(x + sx * (dx + w / 2), y + ang * w * .5); ctx.stroke(); }
}
function bigText(txt, x, y, size, fill, stroke, a = 1, sc = 1, rot = 0) {
  if (a <= 0 || sc <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.font = `800 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * .22; ctx.strokeStyle = stroke; ctx.strokeText(txt, 0, 0);
  ctx.fillStyle = fill; ctx.fillText(txt, 0, 0); ctx.restore();
}
const COLORS = { kirmizi: '#ff4d5e', turuncu: '#ff9a3c', sari: '#ffe14d', yesil: '#4fd16a', mavi: '#4aa8ff', mor: '#a66bff' };
const RGB = { kirmizi: '255,77,94', turuncu: '255,154,60', sari: '255,225,77', yesil: '79,209,106', mavi: '74,168,255', mor: '166,107,255' };
function orb(x, y, c, t, s = 1) {
  ctx.save(); ctx.translate(x, y + Math.sin(t * 3) * 6 * s); ctx.scale(s, s);
  glow(0, 0, 110, RGB[c], .6);
  const g = ctx.createRadialGradient(-10, -12, 4, 0, 0, 38); g.addColorStop(0, '#fff'); g.addColorStop(.35, COLORS[c]); g.addColorStop(1, COLORS[c]);
  ctx.fillStyle = g; circ(0, 0, 36); ctx.fill();
  for (let i = 0; i < 4; i++) { const a = t * 2 + i * 1.57; sparkle(Math.cos(a) * 60, Math.sin(a) * 60, 10, .8); }
  ctx.restore();
}

// ================= characters =================
function pofi(x, y, s, t, o = {}) {
  y += talkBob('pofi', t);
  const bob = o.still ? 0 : Math.sin(t * 2.2) * 8, sq = 1 + Math.sin(t * 4.4) * .025 + (o.squash || 0);
  ctx.save(); ctx.translate(x, y + bob); reg('pofi', 0, 0, s); ctx.rotate(o.rot || 0); ctx.scale(s * sq * (o.stretch || 1), s / sq);
  if (o.glow) glow(0, 0, 260, '255,255,255', o.glow);
  const puffs = [[-95, 25, 62], [-45, -38, 72], [30, -50, 78], [95, -5, 64], [10, 35, 80], [-60, 45, 50], [75, 40, 55]];
  ctx.fillStyle = '#9fb8ff'; for (const p of puffs) { circ(p[0], p[1] + 6, p[2] + 7); ctx.fill(); }
  const g = ctx.createLinearGradient(0, -130, 0, 110); g.addColorStop(0, '#ffffff'); g.addColorStop(.7, '#eef3ff'); g.addColorStop(1, '#c7d6ff');
  ctx.fillStyle = g; for (const p of puffs) { circ(p[0], p[1], p[2]); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.9)'; circ(-40, -70, 22); ctx.fill(); circ(-10, -82, 12); ctx.fill();
  const m = o.mouth ?? mouth('pofi', t), sur = o.surprised || 0;
  let bl = blink(t, 1); if (o.sleepy) bl = Math.max(bl, o.sleepy);
  if (o.puff) { ctx.fillStyle = 'rgba(255,170,190,.9)'; circ(-58, 22, 26); ctx.fill(); circ(58, 22, 26); ctx.fill(); }
  eyes(0, -5, 38, 15, 20, bl, o.look ?? lookAt('pofi'), 1 + sur * .35, o.closed);
  if (o.effort) brows(0, -42, 40, 34, -.5, '#1b1530', 5);
  if (o.worried) brows(0, -44, 40, 30, .45, '#1b1530', 5);
  ctx.fillStyle = 'rgba(255,130,160,.55)'; ell(-68, 22, 20, 11); ctx.fill(); ell(68, 22, 20, 11); ctx.fill();
  if (o.puff) { ctx.fillStyle = '#7a1f3d'; circ(0, 34, 7); ctx.fill(); }
  else if (sur > .5 && m < .06) { ctx.fillStyle = '#7a1f3d'; ell(0, 38, 12, 16); ctx.fill(); }
  else mouthShape(0, 30, 40, m, o.sad ? -1 : 1);
  ctx.restore();
}
function fistik(x, y, s, t, o = {}) {
  y += talkBob('fistik', t);
  ctx.save(); ctx.translate(x, y); reg('fistik', 0, -90 * s, s); ctx.rotate(o.rot || 0); ctx.scale(s * (o.flip ? -1 : 1), s);
  const wag = Math.sin(t * 5) * .08 + (o.wag || 0);
  ctx.save(); ctx.translate(-45, 20); ctx.rotate(wag);
  ctx.fillStyle = '#b8551c'; ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-150, 20, -170, -150, -90, -210); ctx.bezierCurveTo(-30, -250, 40, -200, 10, -150);
  ctx.bezierCurveTo(-30, -120, -70, -150, -60, -120); ctx.bezierCurveTo(-40, -60, 20, -40, 0, 0); ctx.fill();
  ctx.fillStyle = '#e8873e'; ctx.beginPath(); ctx.moveTo(-10, -10);
  ctx.bezierCurveTo(-120, 0, -140, -130, -85, -185); ctx.bezierCurveTo(-45, -215, 5, -190, -5, -160);
  ctx.bezierCurveTo(-60, -160, -90, -110, -10, -10); ctx.fill();
  if (o.messy) { // tangled tail scribbles + leaves
    ctx.strokeStyle = '#7a3a12'; ctx.lineWidth = 4; ctx.beginPath();
    for (let k = 0; k < 14; k++) { const a = k * 1.3; ctx.lineTo(-90 + Math.cos(a) * (30 + k * 3), -130 + Math.sin(a * 1.7) * (35 + k * 2)); } ctx.stroke();
    ctx.fillStyle = '#5b8f3a'; ell(-60, -190, 14, 7, .6); ctx.fill(); ell(-120, -110, 12, 6, -.4); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#d06a28'; ell(0, 0, 58, 72); ctx.fill();
  ctx.fillStyle = '#ffe2bd'; ell(6, 12, 36, 50); ctx.fill();
  const step = o.walk ? Math.sin(t * 12) * 10 : 0;
  ctx.fillStyle = '#b8551c'; ell(-28, 68 - Math.max(0, step), 26, 12); ctx.fill(); ell(30, 68 - Math.max(0, -step), 26, 12); ctx.fill();
  const arm = o.armsUp ? -1 : 0, wave = o.armsUp ? Math.sin(t * 9) * .3 : 0;
  ctx.save(); ctx.translate(-34, -10); ctx.rotate(.6 + arm * 2.2 + wave); ctx.fillStyle = '#c45f22'; ell(0, 22, 12, 26); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(40, -10); ctx.rotate(-.6 - arm * 2.2 - wave); ctx.fillStyle = '#c45f22'; ell(0, 22, 12, 26); ctx.fill(); ctx.restore();
  if (o.hold) { const hy = o.armsUp ? -150 : 10; if (o.hold === 'nut') { ctx.fillStyle = o.nutGray ? '#9a9a9a' : '#8a5a2b'; ell(6, hy, 18, 22); ctx.fill(); ctx.fillStyle = o.nutGray ? '#777' : '#5e3a18'; ell(6, hy - 16, 20, 9); ctx.fill(); } else orb(6, hy - 20, o.hold, t, .6); }
  ctx.translate(0, -95);
  ctx.fillStyle = '#d06a28';
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 22, -35); ctx.lineTo(sx * 46, -88); ctx.lineTo(sx * 56, -25); ctx.fill(); }
  ctx.fillStyle = '#ff9fb0'; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 30, -38); ctx.lineTo(sx * 45, -72); ctx.lineTo(sx * 50, -32); ctx.fill(); }
  ctx.fillStyle = '#d06a28'; ell(0, 0, 62, 55); ctx.fill();
  ctx.fillStyle = '#ffe2bd'; ell(0, 22, 40, 28); ctx.fill();
  let bl = blink(t, 2.3); if (o.sleepy) bl = Math.max(bl, o.sleepy);
  const lk = o.look ?? lookAt('fistik');
  eyes(0, -8, 24, 10, 14, bl, o.flip ? [-lk[0], lk[1]] : lk, o.big || 1, o.closed);
  if (o.scared) brows(0, -30, 24, 18, .5, '#3a1a10', 4);
  if (o.confident) brows(0, -30, 24, 18, -.4, '#3a1a10', 4);
  ctx.fillStyle = '#3a1a10'; ell(0, 12, 9, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,110,120,.5)'; ell(-38, 18, 11, 7); ctx.fill(); ell(38, 18, 11, 7); ctx.fill();
  const m = o.mouth ?? mouth('fistik', t);
  if (o.scared && m < .06) { ctx.fillStyle = '#5a1a1a'; ell(0, 32, 9, 11); ctx.fill(); }
  else mouthShape(0, 26, 26, m, o.sad ? -1 : 1, '#5a1a1a');
  if (m > .06 || o.teeth) { ctx.fillStyle = '#fff'; rrect(-7, 25, 14, 9, 2); ctx.fill(); }
  ctx.restore();
}
function piril(x, y, s, t, o = {}) {
  y += talkBob('piril', t);
  ctx.save(); ctx.translate(x, y); reg('piril', 0, 0, s); ctx.rotate(o.rot || 0); ctx.scale(s, s);
  const pulse = 1 + Math.sin(t * 3) * .05, gl = o.glow ?? 1;
  glow(0, 0, 220 * pulse * (o.glowSize || 1), '255,220,90', .55 * gl);
  starPath(0, 0, 100, 48, 0);
  const g = ctx.createRadialGradient(-20, -30, 10, 0, 0, 110); g.addColorStop(0, '#fffbd0'); g.addColorStop(.6, '#ffd84a'); g.addColorStop(1, '#ffb52e');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#f29a18'; ctx.lineWidth = 5; ctx.stroke();
  let bl = blink(t, 4); if (o.sleepy) bl = Math.max(bl, o.sleepy);
  const lk = o.look ?? lookAt('piril');
  if (o.closed || o.squint) {
    ctx.strokeStyle = '#3a1d00'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (const sx of [-1, 1]) { ctx.beginPath(); if (o.closed) ctx.arc(sx * 24, -4, 10, Math.PI * .15, Math.PI * .85); else { ctx.moveTo(sx * 14, -8); ctx.lineTo(sx * 32, 0); } ctx.stroke(); }
  } else for (const sx of [-1, 1]) {
    ctx.save(); ctx.translate(sx * 24 + lk[0] * 4, -2 + lk[1] * 4); ctx.scale(1, Math.max(.08, 1 - bl));
    ctx.fillStyle = '#3a1d00'; ell(0, 0, 11, 15); ctx.fill(); ctx.fillStyle = '#fff'; circ(-3, -5, 5); ctx.fill(); ctx.restore();
  }
  if (o.sad) brows(0, -28, 24, 18, .5, '#3a1d00', 4);
  ctx.fillStyle = 'rgba(255,120,80,.45)'; ell(-40, 16, 10, 6); ctx.fill(); ell(40, 16, 10, 6); ctx.fill();
  mouthShape(0, 22, 24, o.mouth ?? mouth('piril', t), o.sad ? -1 : 1, '#8a3a00');
  ctx.restore();
}
function homur(x, y, s, t, o = {}) {
  y += talkBob('homur', t);
  const col = o.colorful || 0, mood = o.mood || 'angry';
  ctx.save(); ctx.translate(x + (o.shake ? Math.sin(t * 50) * 4 : 0), y + Math.sin(t * 1.6) * 10); reg('homur', 0, 0, s); ctx.scale(s, s);
  if (mood === 'angry' && col < .5) { // crackling lightning around
    for (let k = 0; k < 2; k++) { const ph = (t * 1.3 + k * .5) % 1; if (ph < .12) { ctx.strokeStyle = 'rgba(255,240,140,.9)'; ctx.lineWidth = 6; ctx.beginPath(); let lx = (k ? 150 : -170), ly = 60; ctx.moveTo(lx, ly); for (let j = 0; j < 5; j++) { lx += (k ? 20 : -20) + Math.sin(j * 7 + t) * 20; ly += 35; ctx.lineTo(lx, ly); } ctx.stroke(); } }
  }
  const puffs = [[-150, 30, 85], [-80, -50, 100], [20, -75, 110], [120, -30, 95], [175, 40, 75], [0, 40, 115], [-100, 70, 75], [100, 75, 80]];
  const rain = ['#ff8a96', '#ffbf7a', '#fff08a', '#8fe7a0', '#8fcaff', '#c9a3ff', '#ffb0d9', '#9ff0ff'];
  ctx.fillStyle = col > .5 ? '#b9a6ff' : '#2a2638'; for (const p of puffs) { circ(p[0], p[1] + 8, p[2] + 8); ctx.fill(); }
  puffs.forEach((p, i) => {
    const g = ctx.createLinearGradient(0, -170, 0, 150); g.addColorStop(0, '#6d6880'); g.addColorStop(1, '#3b3650');
    ctx.fillStyle = g; circ(p[0], p[1], p[2]); ctx.fill();
    if (col > 0) { ctx.globalAlpha = col; ctx.fillStyle = rain[i]; circ(p[0], p[1], p[2]); ctx.fill(); ctx.globalAlpha = 1; }
  });
  ctx.fillStyle = `rgba(255,255,255,${.15 + col * .5})`; circ(-70, -100, 30); ctx.fill();
  const bl = blink(t, 3.1), lk = o.look ?? lookAt('homur');
  if (o.cover) { // covering eyes from flash
    eyes(0, -10, 50, 17, 22, 0, [0, 0], 1, true);
    ctx.fillStyle = '#4a4560'; ell(-55, -10, 50, 34, .3); ctx.fill(); ell(55, -10, 50, 34, -.3); ctx.fill();
  } else eyes(0, -10, 50, 17, 22, bl, lk, mood === 'surprised' ? 1.3 : 1, o.closed);
  const bcol = col > .5 ? '#4a2a6a' : '#141020';
  if (mood === 'angry') brows(0, -50, 52, 52, -.55, bcol, 12);
  else if (mood === 'sad') brows(0, -52, 52, 44, .5, bcol, 9);
  else if (mood === 'surprised') brows(0, -68, 52, 40, 0, bcol, 9);
  else brows(0, -58, 52, 40, .15, bcol, 8);
  ctx.fillStyle = col > .3 ? 'rgba(255,130,160,.6)' : 'rgba(150,120,170,.4)'; ell(-95, 28, 24, 13); ctx.fill(); ell(95, 28, 24, 13); ctx.fill();
  const m = o.mouth ?? mouth('homur', t);
  mouthShape(0, 42, 54, m, mood === 'happy' ? 1 : (mood === 'surprised' ? 0 : -1), '#1a0f24');
  if (o.tears) for (const sx of [-1, 1]) { for (let k = 0; k < 2; k++) { const ph = (t * 1.1 + k * .5 + (sx > 0 ? .25 : 0)) % 1; const tc = col > .3 ? ['#ff8a96', '#8fcaff', '#fff08a', '#8fe7a0'][(k + (sx > 0 ? 2 : 0)) % 4] : '#9fd0ff'; ctx.globalAlpha = 1 - ph; ctx.fillStyle = tc; ell(sx * 50, 14 + ph * 90, 7, 11); ctx.fill(); ctx.globalAlpha = 1; } }
  ctx.restore();
}
function tosbi(x, y, s, t, o = {}) {
  y += talkBob('tosbi', t);
  const hide = o.hide || 0;
  ctx.save(); ctx.translate(x, y); reg('tosbi', 0, -40 * s, s); ctx.scale(s, s);
  // feet
  ctx.fillStyle = '#6fae55'; for (const fx of [-75, 75]) { ell(fx, 50, 26, 16); ctx.fill(); }
  // head (behind shell top, peeking out)
  const hy = -70 + hide * 70 + Math.sin(t * 1.2) * 3;
  ctx.save(); ctx.translate(0, hy);
  ctx.fillStyle = '#7cc061'; ell(0, -20, 62, 54); ctx.fill();
  ctx.fillStyle = '#9ad67f'; ell(0, 0, 40, 26); ctx.fill();
  const lk = o.look ?? lookAt('tosbi');
  eyes(0, -32, 24, 8, 10, Math.max(blink(t, 5), .35), lk, 1);
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 4; circ(-24, -32, 17); ctx.stroke(); circ(24, -32, 17); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-7, -32); ctx.lineTo(7, -32); ctx.stroke();
  ctx.fillStyle = '#f4f4f0'; ctx.beginPath(); ctx.moveTo(-22, 8); ctx.quadraticCurveTo(0, 60 + Math.sin(t * 2) * 3, 22, 8); ctx.fill();
  mouthShape(0, 4, 24, o.mouth ?? mouth('tosbi', t), 1, '#3b2a1a');
  ctx.restore();
  // shell
  ctx.fillStyle = '#5e7f3a'; ell(0, 20, 120, 80); ctx.fill();
  const g = ctx.createRadialGradient(-30, -20, 10, 0, 10, 130); g.addColorStop(0, '#c99a52'); g.addColorStop(1, '#8a5f2a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 10, 112, 78, 0, Math.PI, 0); ctx.lineTo(112, 30); ctx.quadraticCurveTo(0, 60, -112, 30); ctx.fill();
  ctx.strokeStyle = '#6a4519'; ctx.lineWidth = 5;
  for (const [hx, hy2] of [[0, -25], [-55, -5], [55, -5], [-28, 30], [28, 30]]) { ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; ctx.lineTo(hx + Math.cos(a) * 24, hy2 + Math.sin(a) * 20); } ctx.closePath(); ctx.stroke(); }
  ctx.restore();
}

// ================= thought bubble & subtitles =================
function thoughtBubble(t) {
