<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Bangers"; src: url("../assets/fonts/bangers-latin.woff2"); }
@font-face { font-family: "Bangers"; src: url("../assets/fonts/bangers-latin-ext.woff2"); unicode-range: U+0100-024F; }
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: #0d1430; font-family: "Bangers", sans-serif; }
#art { position: absolute; inset: 0; width: 1080px; height: 1350px; }
.abs { position: absolute; left: 60px; width: 960px; text-align: center; }
.hi { top: 40px; color: #fff; font-size: 64px; letter-spacing: 8px; }
.name { top: 132px; color: #ffd84a; font-size: 170px; line-height: 1; -webkit-text-stroke: 12px #16121c; paint-order: stroke fill; text-shadow: 14px 14px 0 #ff7a1a; letter-spacing: 6px; }
.sub { top: 318px; }
.sub span { display: inline-block; background: #fff; color: #16121c; border: 6px solid #16121c; border-radius: 40px; padding: 12px 30px 8px; font-size: 46px; letter-spacing: 3px; box-shadow: 8px 8px 0 #ff7a1a; }
.first { position: absolute; left: 60px; top: 760px; width: 560px; text-align: left; }
.first .k { display: inline-block; background: #16121c; color: #ffd84a; padding: 8px 20px 4px; font-size: 40px; letter-spacing: 4px; }
.first .t1 { display: block; margin-top: 10px; color: #ff7a1a; font-size: 110px; line-height: 0.95; -webkit-text-stroke: 9px #16121c; paint-order: stroke fill; text-shadow: 9px 9px 0 #16121c; }
.first .t2 { display: block; color: #ffd84a; font-size: 130px; line-height: 0.95; -webkit-text-stroke: 9px #16121c; paint-order: stroke fill; text-shadow: 9px 9px 0 #16121c; }
.first .d { display: inline-block; margin-top: 18px; background: #fff; color: #16121c; border: 5px solid #16121c; padding: 10px 18px 6px; font-size: 34px; line-height: 1.15; letter-spacing: 1px; }
.time { position: absolute; left: 60px; top: 1238px; width: 960px; text-align: center; }
.time span { display: inline-block; background: #e8443a; color: #fff; border: 6px solid #16121c; padding: 10px 30px 4px; font-size: 46px; letter-spacing: 3px; white-space: nowrap; box-shadow: 8px 8px 0 #16121c; transform: rotate(-1.5deg); }
</style></head>
<body>
<svg id="art" data-art="welcome"></svg>
<div class="abs hi">HOŞ GELDİN!</div>
<div class="abs name">MİKRO DÜNYA</div>
<div class="abs sub"><span>KISA DİZİLER · BÜYÜK HİKÂYELER</span></div>
<div class="first">
  <span class="k">İLK DİZİMİZ</span>
  <span class="t1">GİZEMLİ</span><span class="t2">KURYE</span>
  <span class="d">KENDİ ŞİRKETİNE KURYE KILIĞINDA<br/>GİREN PATRON... VE BİR SIR.</span>
</div>
<div class="time"><span>HER GÜN 20:00'DE YENİ BÖLÜM · TAKİP ET!</span></div>
<script src="../assets/comic.js"></script>
<script src="../assets/comic_ep.js"></script>
<script>
  const L = Comic.lib;
  L.PANELS.welcome = function (rand) {
    let s = L.rect(0, 0, 1080, 1350, "#0d1430") + L.speedLines(rand, 540, 560, "#1c2a55", 70) + L.dots(0, 0, 1080, 1350, 0.10, true);
    for (const [x, y, r] of [[120, 420, 9], [960, 440, 12], [80, 640, 7], [1000, 660, 8], [300, 400, 6], [790, 400, 6]]) s += `<circle cx="${x}" cy="${y}" r="${r}" fill="#ffd84a"/>`;
    // the Mikro Dünya mini planet from the profile picture, smaller
    s += `<g transform="translate(540 560) scale(0.62) translate(-540 -600)">
      <ellipse cx="540" cy="610" rx="380" ry="110" fill="none" stroke="#ffd84a" stroke-width="14" stroke-dasharray="26 22" transform="rotate(-14 540 610)"/>
      <circle cx="540" cy="600" r="250" fill="#ff7a1a" stroke="#16121c" stroke-width="14"/>
      <path d="M 302,650 C 400,600 480,700 560,660 C 640,620 700,690 790,650 C 760,780 640,850 540,850 C 420,850 330,770 302,650 Z" fill="#2e9d55" stroke="#16121c" stroke-width="8"/>
      <path d="M 330,520 C 380,500 420,540 470,520" fill="none" stroke="#ffe7a6" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
      <g stroke="#16121c" stroke-width="8"><rect x="455" y="300" width="70" height="80" fill="#3d8bd9"/><rect x="525" y="230" width="60" height="150" fill="#26355e"/><rect x="585" y="290" width="62" height="90" fill="#e8443a"/><rect x="410" y="330" width="45" height="50" fill="#ffd84a"/></g>
      <g fill="#ffd27a"><rect x="537" y="250" width="12" height="16"/><rect x="561" y="250" width="12" height="16"/><rect x="537" y="285" width="12" height="16"/><rect x="470" y="320" width="14" height="16"/><rect x="600" y="310" width="14" height="16"/></g>
      <path d="M 172,710 A 380,110 -14 0 0 912,530" fill="none" stroke="#ffd84a" stroke-width="14"/>
      <g transform="translate(840 520) rotate(-14) scale(0.62)">
        <circle cx="-110" cy="50" r="46" fill="#1c1c22" stroke="#16121c" stroke-width="8"/><circle cx="120" cy="50" r="46" fill="#1c1c22" stroke="#16121c" stroke-width="8"/>
        <path d="M -160,30 C -150,-30 -40,-50 10,-30 L 90,-30 L 130,-130 L 160,-130 L 115,0 L 90,30 Z" fill="#ff7a1a" stroke="#16121c" stroke-width="8"/>
        <rect x="-20" y="-100" width="120" height="70" rx="10" fill="#fff" stroke="#16121c" stroke-width="8"/></g>
    </g>`;
    // the first show: orange band with Cem and Ece on the right
    s += L.rect(0, 730, 1080, 620, "#ff7a1a") + L.dots(0, 730, 1080, 620, 0.16) + L.line("M 0,730 L 1080,730", 10);
    s += L.bust("ece", "blue", "kind", { t: "translate(940 1000) scale(0.52)" });
    s += L.bust("cem", "courier", "smirk", { t: "translate(780 1020) scale(0.6)", light: "left" });
    return s;
  };
  Comic.drawAll(document);
  document.getElementById("art").setAttribute("viewBox", "0 0 1080 1350");
</script>
</body></html>
