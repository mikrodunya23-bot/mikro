<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<title>Hormonlar Örnek</title>
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:Inter,sans-serif}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
svg{position:absolute;inset:0}
#cap{position:absolute;left:0;right:0;margin:0 auto;bottom:54px;width:max-content;max-width:1560px;text-align:center;
 font:700 44px/1.25 Inter,sans-serif;color:#fff;padding:14px 34px;border-radius:22px;background:rgba(8,6,30,.55);
 letter-spacing:.2px;white-space:pre-line}
#cap:empty{display:none}
.lbl{font-family:"Inter Display",Inter,sans-serif;font-weight:900}
</style></head>
<body><div id="stage"><svg id="svg" viewBox="0 0 1920 1080" width="1920" height="1080"></svg><div id="cap"></div></div>
<script src="lib/gsap.min.js"></script>
<script>
// ---------- helpers ----------
const W = 1920, H = 1080;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(42);
const heartD = "M0,-6 C-3,-16 -18,-16 -18,-3 C-18,8 -6,15 0,22 C6,15 18,8 18,-3 C18,-16 3,-16 0,-6Z";
const heart = (x,y,s,fill,a='') => `<path ${a} transform="translate(${x},${y}) scale(${s})" d="${heartD}" fill="${fill}"/>`;
const star = (x,y,r,fill,a='') => { let p=[];for(let i=0;i<8;i++){const rr=i%2?r*.42:r,an=Math.PI/4*i-Math.PI/2;p.push((x+rr*Math.cos(an)).toFixed(1)+','+(y+rr*Math.sin(an)).toFixed(1))} return `<polygon ${a} points="${p.join(' ')}" fill="${fill}"/>`};
const pill = (id,x,y,text,bg,fg='#fff',fs=64) => { const w=text.length*fs*.68+80; return `<g id="${id}" opacity="0"><rect x="${x-w/2}" y="${y-fs*.85}" width="${w}" height="${fs*1.5}" rx="${fs*.75}" fill="${bg}"/><text class="lbl" x="${x}" y="${y+fs*.2}" text-anchor="middle" font-size="${fs}" fill="${fg}" letter-spacing="3">${text}</text></g>`};

// ---------- characters (original flat-vector design) ----------
const MERYEM = {kind:'f', skin:'#F9C3B8', skinD:'#E89A97', nose:'#F2909A', hair:'#F7D27A', hairD:'#E3B356', brow:'#E9B95A',
  shirt:'#36C2C9', shirtD:'#249EA6', coat:'#F6F3FB', coatD:'#DCD6EC', pants:'#5C4A8E', pantsD:'#4C3C7A', shoes:'#2C2350', mouth:'#9B2F66'};
const AHMET = {kind:'m', skin:'#E9B48C', skinD:'#C98C68', nose:'#D98A72', hair:'#3A2621', hairD:'#2A1A16', brow:'#2E1D19',
  shirt:'#F3A53A', shirtD:'#D9882A', pants:'#2F4A7E', pantsD:'#263D6A', shoes:'#1D2340', mouth:'#7A2E3A'};
const XRAY = {kind:'f', skin:'#2D6BFF', skinD:'#2D6BFF', nose:'#2D6BFF', hair:'#2D6BFF', hairD:'#2D6BFF', brow:'#2D6BFF',
  shirt:'#2D6BFF', shirtD:'#2D6BFF', coat:'#2D6BFF', coatD:'#2D6BFF', pants:'#2D6BFF', pantsD:'#2D6BFF', shoes:'#2D6BFF', mouth:'#2D6BFF', xray:true};

function char(id, P, o={}){
  const f = P.kind==='f', sleeve = P.coat||P.shirt, sleeveD = P.coatD||P.shirtD;
  let s = `<g id="${id}">`;
  if(f) s += `<g id="${id}-hairBack"><rect x="94" y="108" width="212" height="334" rx="96" fill="${P.hair}"/><rect x="250" y="210" width="56" height="228" rx="28" fill="${P.hairD}"/></g>`;
  s += `<g id="${id}-legL"><rect x="148" y="598" width="46" height="272" rx="22" fill="${P.pants}"/><ellipse cx="163" cy="878" rx="40" ry="20" fill="${P.shoes}"/></g>`;
  s += `<g id="${id}-legR"><rect x="206" y="598" width="46" height="272" rx="22" fill="${P.pantsD}"/><ellipse cx="237" cy="878" rx="40" ry="20" fill="${P.shoes}"/></g>`;
  s += `<g id="${id}-armR"><rect x="264" y="392" width="44" height="214" rx="22" fill="${sleeveD}"/><circle cx="286" cy="610" r="24" fill="${P.skin}"/></g>`;
  s += `<path d="M122,428 Q122,378 168,374 L232,374 Q278,378 278,428 L272,642 L128,642 Z" fill="${P.shirt}"/>`;
  if(P.coat){
    s += `<path d="M118,428 Q118,378 168,374 L186,374 L201,478 L197,654 L122,654 Z" fill="${P.coat}"/>`+
         `<path d="M282,428 Q282,378 232,374 L214,374 L199,478 L203,654 L278,654 Z" fill="${P.coatD}"/>`+
         `<path d="M168,376 L186,376 L196,450 L160,410 Z" fill="${P.coatD}"/><path d="M232,376 L214,376 L204,450 L240,410 Z" fill="${P.coat}"/>`+
         `<rect x="142" y="560" width="40" height="10" rx="5" fill="${P.coatD}"/>`;
  } else {
    s += `<path d="M160,376 Q200,420 240,376 Z" fill="${P.shirtD}"/><rect x="150" y="548" width="100" height="56" rx="20" fill="${P.shirtD}"/>`+
         `<rect x="182" y="392" width="7" height="60" rx="3.5" fill="#fff" opacity=".85"/><rect x="211" y="392" width="7" height="60" rx="3.5" fill="#fff" opacity=".85"/>`;
  }
  s += `<rect x="178" y="318" width="44" height="66" rx="14" fill="${P.skinD}"/>`;
  s += `<g id="${id}-armL"><rect x="92" y="392" width="44" height="214" rx="22" fill="${sleeve}"/><circle cx="114" cy="610" r="24" fill="${P.skin}"/></g>`;
  if(P.xray) s += o.organs||'';
  s += `<g id="${id}-head">`;
  s += `<circle cx="116" cy="250" r="22" fill="${P.skin}"/><circle cx="117" cy="252" r="10" fill="${P.skinD}"/><circle cx="284" cy="250" r="22" fill="${P.skin}"/><circle cx="283" cy="252" r="10" fill="${P.skinD}"/>`;
  s += `<rect x="118" y="138" width="164" height="202" rx="74" fill="${P.skin}"/>`;
  if(!P.xray) s += `<path d="M282,230 Q284,318 230,338 Q262,300 266,232Z" fill="${P.skinD}" opacity=".45"/>`;
  if(f) s += `<path d="M108,252 Q98,102 200,100 Q304,102 294,252 L282,214 Q262,160 196,158 Q150,160 128,202 Q118,224 118,252 Z" fill="${P.hair}"/>`+
             `<rect x="268" y="190" width="32" height="236" rx="16" fill="${P.hair}"/><rect x="102" y="192" width="30" height="206" rx="15" fill="${P.hair}"/>`+
             (P.xray?'':`<path d="M150,128 Q182,112 226,116 Q190,124 160,146Z" fill="#FFF0B8" opacity=".8"/>`);
  else s += `<path d="M110,236 Q102,118 196,108 Q264,100 294,150 Q304,192 290,236 L280,198 Q248,170 196,174 Q150,176 124,208 Z" fill="${P.hair}"/>`+
            `<path d="M140,134 Q196,64 270,112 Q236,100 206,124 Q178,112 140,134Z" fill="${P.hair}"/><rect x="113" y="200" width="16" height="50" rx="8" fill="${P.hair}"/><rect x="271" y="200" width="16" height="50" rx="8" fill="${P.hair}"/>`+
            `<path d="M220,120 Q250,112 272,132 Q248,124 226,130Z" fill="#6A4A40"/>`;
  if(!P.xray){
    s += `<g id="${id}-browL"><rect x="140" y="200" width="48" height="16" rx="8" fill="${P.brow}"/></g><g id="${id}-browR"><rect x="212" y="200" width="48" height="16" rx="8" fill="${P.brow}"/></g>`;
    s += `<g id="${id}-e-dot"><circle cx="164" cy="242" r="9.5" fill="#3B2C4A"/><circle cx="236" cy="242" r="9.5" fill="#3B2C4A"/></g>`;
    s += `<g id="${id}-e-big" opacity="0"><circle cx="164" cy="240" r="20" fill="#fff"/><circle cx="164" cy="242" r="7" fill="#3B2C4A"/><circle cx="236" cy="240" r="20" fill="#fff"/><circle cx="236" cy="242" r="7" fill="#3B2C4A"/></g>`;
    s += `<g id="${id}-e-heart" opacity="0">${heart(164,240,1.25,'#FF3D7F')}${heart(236,240,1.25,'#FF3D7F')}</g>`;
    s += `<g id="${id}-e-half" opacity="0"><rect x="148" y="238" width="34" height="9" rx="4.5" fill="#3B2C4A"/><rect x="218" y="238" width="34" height="9" rx="4.5" fill="#3B2C4A"/></g>`;
    s += `<g id="${id}-e-happy" opacity="0"><path d="M150,246 Q164,228 178,246" stroke="#3B2C4A" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M222,246 Q236,228 250,246" stroke="#3B2C4A" stroke-width="8" fill="none" stroke-linecap="round"/></g>`;
    s += `<ellipse cx="200" cy="278" rx="17" ry="12" fill="${P.nose}"/>`;
    s += `<g id="${id}-blush" opacity="0"><ellipse cx="148" cy="290" rx="21" ry="11" fill="#FF5C8D" opacity=".5"/><ellipse cx="252" cy="290" rx="21" ry="11" fill="#FF5C8D" opacity=".5"/></g>`;
    const M = P.mouth;
    s += `<g id="${id}-m-neutral"><rect x="184" y="308" width="32" height="8" rx="4" fill="${M}"/></g>`;
    s += `<g id="${id}-m-smile" opacity="0"><path d="M172,302 Q200,334 228,302 Q200,316 172,302Z" fill="${M}"/></g>`;
    s += `<g id="${id}-m-grin" opacity="0"><path d="M166,300 Q200,348 234,300 Z" fill="${M}"/><path d="M182,318 Q200,334 218,318 Q200,322 182,318Z" fill="#FF8FB0"/></g>`;
    s += `<g id="${id}-m-o" opacity="0"><ellipse cx="200" cy="314" rx="12" ry="16" fill="${M}"/></g>`;
    s += `<g id="${id}-m-scream" opacity="0"><path d="M158,334 Q156,290 200,290 Q244,290 242,334 Q222,318 200,320 Q178,318 158,334Z" fill="${M}"/><path d="M178,326 Q200,312 222,326 Q200,322 178,326Z" fill="#FF7FA6"/></g>`;
    s += `<g id="${id}-m-flat" opacity="0"><path d="M180,314 Q200,309 220,314" stroke="${M}" stroke-width="8" fill="none" stroke-linecap="round"/></g>`;
  }
  s += `</g></g>`;
  return s;
}
const MOUTHS=['neutral','smile','grin','o','scream','flat'], EYES=['dot','big','heart','half','happy'];
function face(tl,id,o,t){
  if(o.m) MOUTHS.forEach(m=>tl.set(`#${id}-m-${m}`,{opacity:m===o.m?1:0},t));
  if(o.e) EYES.forEach(e=>tl.set(`#${id}-e-${e}`,{opacity:e===o.e?1:0},t));
}

// ---------- cat ----------
const C = {o:'#F28C38', d:'#D2681C', b:'#FFE0B5', n:'#FF7FA6', k:'#3B2C4A'};
const catJump = `<g id="catJ"><path d="M-150,-10 L-200,-120 L-170,-112 L-196,-190 L-160,-150 L-150,-215 L-128,-140 Z" fill="${C.d}"/>`+
 `<path d="M-160,20 Q-170,-90 -40,-100 Q90,-110 110,-20 Q120,40 40,60 Q-130,80 -160,20Z" fill="${C.o}"/>`+
 `<path d="M-150,0 L-170,-30 L-140,-20 L-150,-60 L-120,-34 L-110,-80 L-90,-40 L-70,-96 L-50,-50 L-20,-104 L0,-56 L30,-100 L40,-50 L70,-90 L70,-40" fill="${C.o}"/>`+
 `<rect x="-150" y="30" width="34" height="120" rx="17" fill="${C.d}" transform="rotate(25 -133 30)"/><rect x="-60" y="40" width="34" height="120" rx="17" fill="${C.o}" transform="rotate(-10 -43 40)"/>`+
 `<rect x="40" y="30" width="34" height="120" rx="17" fill="${C.o}" transform="rotate(-35 57 30)"/><rect x="80" y="0" width="34" height="110" rx="17" fill="${C.d}" transform="rotate(-60 97 0)"/>`+
 `<g transform="translate(120,-60)"><path d="M-70,-40 L-60,-120 L-20,-70Z" fill="${C.o}"/><path d="M70,-40 L60,-120 L20,-70Z" fill="${C.o}"/><path d="M-56,-56 L-52,-100 L-30,-72Z" fill="${C.n}"/><path d="M56,-56 L52,-100 L30,-72Z" fill="${C.n}"/>`+
 `<circle r="82" fill="${C.o}"/><ellipse cx="0" cy="34" rx="50" ry="36" fill="${C.b}"/>`+
 `<circle cx="-32" cy="-14" r="22" fill="#FFF7C2"/><circle cx="32" cy="-14" r="22" fill="#FFF7C2"/><ellipse cx="-32" cy="-14" rx="5" ry="17" fill="${C.k}"/><ellipse cx="32" cy="-14" rx="5" ry="17" fill="${C.k}"/>`+
 `<path d="M-30,-48 L-6,-36 M30,-48 L6,-36" stroke="${C.k}" stroke-width="8" stroke-linecap="round"/>`+
 `<path d="M-30,30 Q0,10 30,30 Q30,62 0,64 Q-30,62 -30,30Z" fill="${C.k}"/><path d="M-22,28 L-16,44 L-10,30Z M22,28 L16,44 L10,30Z" fill="#fff"/><ellipse cx="0" cy="16" rx="10" ry="7" fill="${C.n}"/>`+
 `<path d="M-50,22 L-110,10 M-50,32 L-112,38 M50,22 L110,10 M50,32 L112,38" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"/></g></g>`;
const catSit = `<g id="catS"><path d="M70,90 Q160,90 150,20 Q144,-20 120,-10 Q136,30 110,60 Q90,74 60,70Z" fill="${C.d}"/>`+
 `<path d="M-80,100 Q-100,-40 0,-50 Q100,-40 80,100Z" fill="${C.o}"/><ellipse cx="0" cy="40" rx="44" ry="56" fill="${C.b}"/>`+
 `<rect x="-50" y="60" width="34" height="44" rx="17" fill="${C.o}"/>`+
 `<g transform="translate(0,-90)"><path d="M-62,-30 L-54,-104 L-16,-58Z" fill="${C.o}"/><path d="M62,-30 L54,-104 L16,-58Z" fill="${C.o}"/><path d="M-50,-44 L-47,-86 L-26,-60Z" fill="${C.n}"/><path d="M50,-44 L47,-86 L26,-60Z" fill="${C.n}"/>`+
 `<circle r="74" fill="${C.o}"/><ellipse cx="0" cy="28" rx="44" ry="32" fill="${C.b}"/>`+
 `<path d="M-46,-8 Q-30,4 -14,-8 M14,-8 Q30,4 46,-8" stroke="${C.k}" stroke-width="7" fill="none" stroke-linecap="round"/>`+
 `<ellipse cx="0" cy="14" rx="9" ry="6" fill="${C.n}"/><path d="M-12,26 Q0,34 0,24 Q0,34 12,26" stroke="${C.k}" stroke-width="4" fill="none" stroke-linecap="round"/>`+
 `<ellipse id="tongue" cx="18" cy="38" rx="7" ry="9" fill="${C.n}" opacity="0"/>`+
 `<path d="M-44,20 L-100,12 M-44,30 L-100,36 M44,20 L100,12 M44,30 L100,36" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"/></g>`+
 `<g id="catPaw"><rect x="16" y="-10" width="34" height="96" rx="17" fill="${C.o}"/></g></g>`;

// ---------- props ----------
const bin = `<g id="bin"><path d="M-110,0 L-92,-250 L92,-250 L110,0Z" fill="#3E9B6E"/><path d="M40,-250 L92,-250 L110,0 L56,0Z" fill="#2F7E58"/>`+
  `<rect x="-60" y="-210" width="16" height="180" rx="8" fill="#2F7E58"/><rect x="-8" y="-210" width="16" height="180" rx="8" fill="#2F7E58"/>`+
  `<rect x="-104" y="-262" width="208" height="24" rx="12" fill="#56B886"/></g>`;
const lid = `<g id="lid"><ellipse cx="0" cy="0" rx="118" ry="26" fill="#56B886"/><ellipse cx="0" cy="-6" rx="96" ry="18" fill="#6CCB98"/><rect x="-26" y="-34" width="52" height="20" rx="10" fill="#2F7E58"/></g>`;
const bag = `<g id="bag"><path d="M-40,0 Q-62,90 0,104 Q62,90 40,0 Q0,-18 -40,0Z" fill="#33405E"/><path d="M-14,-6 L-24,-34 L0,-18 L24,-34 L14,-6Z" fill="#33405E"/><path d="M14,20 Q30,60 18,90" stroke="#4A5A80" stroke-width="8" fill="none" stroke-linecap="round"/></g>`;

// ---------- scenes ----------
function tree(x,y,s,c1,c2){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-14" y="-40" width="28" height="160" rx="12" fill="#9A6A4E"/><circle cx="0" cy="-110" r="110" fill="${c1}"/><circle cx="50" cy="-90" r="80" fill="${c2}"/><circle cx="-60" cy="-70" r="60" fill="${c1}"/></g>`}
let svg = '';
svg += `<defs>
 <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9E7D"/><stop offset=".6" stop-color="#FFC99A"/><stop offset="1" stop-color="#FFE2B0"/></linearGradient>
 <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1440"/><stop offset="1" stop-color="#22357E"/></linearGradient>
 <radialGradient id="gGlowY"><stop offset="0" stop-color="#FFE45C" stop-opacity="1"/><stop offset="1" stop-color="#FFE45C" stop-opacity="0"/></radialGradient>
 <radialGradient id="gGlowP"><stop offset="0" stop-color="#FF7FB0" stop-opacity=".9"/><stop offset="1" stop-color="#FF7FB0" stop-opacity="0"/></radialGradient>
 <radialGradient id="gGlowR"><stop offset="0" stop-color="#FF3B3B" stop-opacity="1"/><stop offset="1" stop-color="#FF3B3B" stop-opacity="0"/></radialGradient>
 <radialGradient id="gLamp"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".55"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>`;

// Shot A: park at sunset
const AX = 330, AY = 150, AS = .95, MX = 1130;
svg += `<g id="shotA"><g id="Az"><rect width="${W}" height="${H}" fill="url(#gSky)"/>
 <circle cx="1500" cy="330" r="150" fill="#FFF1C9" opacity=".9"/>
 <path d="M0,720 Q300,560 640,690 Q980,800 1300,640 Q1600,520 1920,660 L1920,1080 L0,1080Z" fill="#F4A08E"/>
 <path d="M0,800 Q480,700 960,790 Q1440,870 1920,760 L1920,1080 L0,1080Z" fill="#8AD39A"/>
 <rect x="0" y="930" width="${W}" height="150" fill="#6CC084"/>
 ${tree(160,820,1.1,'#5FBF7F','#4BA86C')}${tree(1780,840,1.2,'#5FBF7F','#4BA86C')}${tree(1000,760,.7,'#74CC8E','#5FBF7F')}
 <g transform="translate(560,900)"><rect x="0" y="-70" width="340" height="26" rx="13" fill="#B5734F"/><rect x="0" y="-26" width="340" height="24" rx="12" fill="#A0603F"/><rect x="24" y="-6" width="20" height="70" rx="8" fill="#7A4630"/><rect x="296" y="-6" width="20" height="70" rx="8" fill="#7A4630"/></g>
 <ellipse cx="${AX+200*AS}" cy="${AY+880*AS}" rx="140" ry="22" fill="#000" opacity=".12"/>
 <ellipse id="mpShadow" cx="${MX+200*AS}" cy="${AY+880*AS}" rx="140" ry="22" fill="#000" opacity=".12"/>
 <circle id="oxGlow" cx="960" cy="420" r="420" fill="url(#gGlowP)" opacity="0"/>
 <g transform="translate(${AX},${AY}) scale(${AS})"><g id="apWrap">${char('ap',AHMET)}</g></g>
 <g transform="translate(${MX},${AY}) scale(${AS})"><g id="mpWrap">${char('mp',MERYEM)}</g></g>
 <g id="sparks">${Array.from({length:9},(_,i)=>{const a=i/9*Math.PI*2;return star(AX+200*AS+Math.cos(a)*170,AY+240*AS+Math.sin(a)*150,26,i%2?'#FFF27A':'#FFFFFF','class="spk"')}).join('')}</g>
 <g id="oxHearts">${Array.from({length:16},(_,i)=>heart(0,0,1.4+R()*1.2,i%3?'#FF5C9A':'#FF9CC4',`class="oxh"`)).join('')}</g>
 ${pill('oxLbl',960,92,'OKSİTOSİN','#FF4F92')}
 <g id="chips">${['GÜVEN','SICAKLIK','BAĞ'].map((w,i)=>`<g class="chip" id="chip${i}" opacity="0"><rect x="${960+(i-1)*300-125}" y="150" width="250" height="66" rx="33" fill="#fff"/><text class="lbl" x="${960+(i-1)*300}" y="197" text-anchor="middle" font-size="38" fill="#FF4F92" letter-spacing="2">${w}</text></g>`).join('')}</g>
</g></g>`;

// Shot B: inside Ahmet's head
const BS = 3.1, BX = 960-200*BS, BY = 560-240*BS;
let rays=''; for(let i=0;i<14;i++){const a=i/14*Math.PI*2; rays+=`<path d="M960,540 L${960+Math.cos(a)*1600},${540+Math.sin(a)*1600} L${960+Math.cos(a+.12)*1600},${540+Math.sin(a+.12)*1600}Z" fill="#3B2A7A" opacity=".55"/>`}
const BRx = 960, BRy = 395;
let brain = `<g id="brain"><ellipse cx="${BRx}" cy="${BRy}" rx="300" ry="190" fill="#140C38" opacity=".85" stroke="#FF8FC2" stroke-width="8"/>`+

  const src=i%2?[164,494]:[236,494], tg=tgts[i%tgts.length], t0=25.5+i*.04;
  const jx=(R()-.5)*50, jy=(R()-.5)*50;
  tl.set(el,{attr:{cx:src[0],cy:src[1]},opacity:1},t0); tl.to(el,{attr:{cx:tg[0]+jx,cy:tg[1]+jy},duration:.9,ease:'power1.inOut'},t0);
  tl.to(el,{opacity:0,duration:.4},t0+.9);
});
tl.to('#xHeart',{scale:1.35,transformOrigin:'50% 50%',duration:.14,repeat:13,yoyo:true},25.6);
tl.to('#mxWrap',{css:{opacity:.8},duration:.5},25.6);

show('#shotG',27.4,.15); hide('#shotX',27.6);

face(tl,'mn',{m:'flat',e:'half'},34.5); tl.to('#mn-browL,#mn-browR',{y:6,duration:.2},34.5);

tl.to('#mnWrap',{y:12,duration:.5},34.5);

// ---------- seek API for the renderer ----------
const cap = document.getElementById('cap');
function caption(t){
  let s=''; for(const k in L){ if(t>=L[k]-0.05 && t<=L[k]+DUR[k]+0.3) s=TEXT[k]; }
  if(t>35.2) s='';
  if(cap.textContent!==s) cap.textContent=s;
}
function bpm(t){ const v = t<27.5?72:Math.min(165, Math.round(72+(t-27.5)/1.5*93)); document.getElementById('bpm').textContent = v+' nabız'; }
window.DURATION = END;
window.seek = t => { tl.seek(t,false); caption(t); bpm(t); };
window.seek(0);
</script></body></html>
